url: "https://edi-tool.github.io"
baseurl: "/kokuban-adjust"

plugins:
  - jekyll-sitemap
show_downloads: false
google_analytics: edi-tool
show_edit_on_github: false

# 検証用の開発ページ。公開はするが検索には載せない（lab.html 側で noindex 指定）。

# Search Console の所有権確認ファイルを jekyll-sitemap の出力から除外する
defaults:
  - scope:
      path: "googled180bd734463e748.html"
    values:
      sitemap: false

# 開発用ファイルを公開ビルドから外す（Pages で CLAUDE.md などが配信されないように）
exclude:
  - CLAUDE.md
  - AGENTS.md
  - DESIGN.md
  - progress.md
  - README.md
  - CHANGELOG.md
  - package.json
  - scripts/
  - tests/
  - docs/
